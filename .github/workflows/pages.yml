# ForkPlus 插件仓库 · Pages 站点自动生成
#
# 全流程（对应 .github/scripts/）：
#   ① 构建仓库内插件（plugins/*/*.csproj，linux-x64）
#   ② 下载最新的 ForkPlus 发行包（releases/latest 的 linux-x64）
#   ③ 把插件 DLL 装入 ForkPlus 的 plugins/ 目录
#   ④ 无头环境（Xvfb + openbox）启动 ForkPlus，打开预置 demo 仓库
#   ⑤ 逐个触发各插件的对比视图（PDF / Office / 压缩包 / 字体 / 可执行文件 / 证书 / 音频 / 视频 / 结构化数据 / DBC / 字幕 / SVG / 机器学习模型 / MIDI / Torrent / 抓包 / PSD / EPUB / SQLite / 托管程序集 / 邮件 EML），各自截取完整软件界面（整屏 1920x1280，不裁切）
#   ⑥ 注入模板生成 pages/ 站点（总览页 + 各插件子页）并发布到 GitHub Pages
#
# 触发：master 分支涉及插件/脚本/模板的改动，或手动触发；tag 发布后也刷新一次。
#
# 发布前需在仓库 Settings → Pages 中将 Source 设为 "GitHub Actions"。

name: pages

on:
  push:
    branches: [master]
    paths:
      - 'plugins/**'
      - 'sdk/**'
      - '.github/scripts/**'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
    tags: ["v*"]
  workflow_dispatch:

# 同一时刻只保留一轮站点生成：一次「推 master + 打 tag」会命中两个触发条件（分支推送 + 标签推送，
# 内容与 SHA 相同），cancel-in-progress 让后到的 tag 那一轮顶掉 master 那一轮，只跑一次。
# 因此 Actions 列表里常能看到 master 那轮显示 cancelled——这是**去重的预期行为**，不是故障；
# 真正会让整轮白跑的是 build job 超时（见下方 timeout-minutes），那会连 tag 那一轮也一起掐掉。
concurrency:
  group: pages
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    # 截图是「逐个视图启动一次 ForkPlus、点行、整屏截图、退出」的串行流程，单张约 40~60 秒，
    # 与插件数（截图数）线性增长。当前 pages/assets 下共 90 张截图，实测整步约 85~110 分钟
    #（含取三方件 / 构建插件 / 下载宿主）；原先的 45 分钟会中途被 job 超时掐断（现象是 run 显示
    # cancelled、截图只产出一半），故按最坏情况留足余量。误改成 45~60 会让 CI 再次「一直被取消」。
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要 tag 才能把「Plugins 版本」徽章显示成最近的发行标签（如 v1.1.1）；
          # 浅克隆下无 tag，git describe 只能退回短 SHA。
          fetch-depth: 0

      - name: Resolve plugins version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git describe --tags --abbrev=0 2>/dev/null || echo dev)"
          fi
          echo "PLUGIN_VERSION=$version" >> "$GITHUB_ENV"
          echo "plugins version: $version"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 无头 GUI 截图所需的 X 环境与图像工具；字体 / 可执行文件 / 证书 demo 还需
      # 系统字体（fonts-dejavu、fonts-liberation）、cc + binutils（编译 ELF/ar）与 openssl（造证书）；
      # 音频 / 视频 demo 用 ffmpeg CLI 现造样本（插件自身用随包分发的 FFmpeg 原生库解码，
      # 与这里造样本用的系统 ffmpeg 相互独立）。
      - name: Install headless toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils xdotool openbox imagemagick wmctrl unzip \
            fonts-dejavu fonts-liberation gcc binutils openssl ffmpeg

      - name: Capture plugin diff screenshots
        run: bash .github/scripts/capture-screenshots.sh

      - name: Build pages
        run: python3 .github/scripts/build-pages.py

      # 截图同时作为构建产物上传，便于排查
      - name: Upload screenshots (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-screenshots
          path: pages/assets/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4